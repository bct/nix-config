# https://github.com/Klipper3d/klipper/blob/0cee841e31d701595b3e509a0b502f6e320f52a8/config/sample-macros.cfg

[gcode_macro PRINT_END]
gcode:
  {% set max = printer.toolhead.axis_maximum %}
  {% set z = [printer.toolhead.position.z + 10, max.z]|min %}
  # Turn off bed, extruder, and fan
  M140 S0
  M104 S0
  M106 S0
  # Retract, lift, then present the bed
  G91
  G1 E-5 F1800
  G90
  G1 Z{z} F600
  G1 X10 Y{max.y - 5} F3000
  # Disable steppers
  M84

# Warm the nozzle to at least TEMP for homing without cooling it down if it's
# already hotter (e.g. straight after a previous print). Only waits for the
# partial warmup when it was colder than TEMP.
[gcode_macro PREHEAT_NOZZLE]
description: Heat the nozzle to at least TEMP, never lowering it
gcode:
    {% set temp = params.TEMP|default(150)|float %}
    {% set current = printer.extruder.temperature %}
    {% set target = printer.extruder.target %}
    {% if current < temp %}
        M104 S{[temp, target]|max}
        G4 S10
    {% else %}
        M104 S{[current, target]|max|round(0)}
    {% endif %}

######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    # publishes to octopi/klipper/filament_change
    {action_call_remote_method("publish_mqtt_topic",
                               topic="klipper/filament_change",
                               payload={"filename": printer.print_stats.filename},
                               qos=1,
                               retain=False,
                               use_prefix=True)}
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

# The default idle timeout turns off all heaters and disables the steppers,
# which drops the bed temperature (the part detaches) and loses homing (RESUME
# fails with "Must home axis first"). While paused, only turn off the hotend
# and tell mainsail.cfg's RESUME (via idle_state) to reheat it to the
# temperature its PAUSE saved, even if it's been heated since to load filament.
[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
        # Give up after 2 hours paused in total (this fires 10 minutes in).
        UPDATE_DELAYED_GCODE ID=pause_timeout DURATION=6600
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

# Settings for mainsail.cfg's PAUSE/RESUME/CANCEL_PRINT. Everything not set
# here uses its default.
[gcode_macro _CLIENT_VARIABLE]
# cancel the pause safety cap below when resuming
variable_user_resume_macro: "UPDATE_DELAYED_GCODE ID=pause_timeout DURATION=0"
gcode:

# The stock LCD menu's OctoPrint submenu only sends "action:resume" etc. to an
# OctoPrint host, which Moonraker ignores. Hide it; use the SD card submenu.
[menu __main __octoprint]
type: disabled

# Safety cap for a paused print: shut everything off as the normal idle
# timeout would. The print stays paused but can't be resumed (homing is lost).
[delayed_gcode pause_timeout]
gcode:
    {% if printer.pause_resume.is_paused %}
        TURN_OFF_HEATERS
        M84
        # publishes to octopi/klipper/pause_timeout
        {action_call_remote_method("publish_mqtt_topic",
                                   topic="klipper/pause_timeout",
                                   payload={"filename": printer.print_stats.filename},
                                   qos=1,
                                   retain=False,
                                   use_prefix=True)}
    {% endif %}

# Klipper no longer loads the "default" bed mesh profile at startup (changed
# upstream in early 2024), so the mesh saved by SAVE_CONFIG sits unused after
# a restart. Load it ourselves once klippy is ready.
[delayed_gcode load_default_bed_mesh]
initial_duration: 1
gcode:
    BED_MESH_PROFILE LOAD=default
