# https://github.com/Klipper3d/klipper/blob/ee2c6fb6b00b2b5d097ef70d0868df7d74943b51/config/generic-bigtreetech-skr-mini-e3-v3.0.cfg
# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
position_min: -3 # for tuning probe z_offset
position_max: 250
# Z endstop disabled because we have a CR Touch
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^PC2
#position_endstop: 0.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pressure_advance: 0.4
# PID_CALIBRATE HEATER=extruder TARGET=200
pid_Kp: 29.195
pid_Ki: 1.802
pid_Kd: 118.240
min_temp: 0
# Spider Pro (V3?)
max_temp: 300

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# https://github.com/Klipper3d/klipper/blob/ee2c6fb6b00b2b5d097ef70d0868df7d74943b51/config/sample-lcd.cfg
######################################################################
# 128x64 Full Graphic Creality CR10 / ENDER 3 stockdisplay
######################################################################

# This section is used for a Creality "12864" display with a single
# ribbon cable between the display's EXP3 plug and the
# micro-controller board's EXP1 connector.

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1


# https://www.klipper3d.org/Config_Reference.html#bltouch

[bltouch]
# Pin connected to the BLTouch sensor pin. Most BLTouch devices
# require a pullup on the sensor pin (prefix the pin name with "^").
sensor_pin: ^PC14
# Pin connected to the BLTouch control pin.
control_pin: PA1
# The amount of time (in seconds) to wait for the BLTouch pin to
# move up or down. The default is 0.680 seconds.
#pin_move_time: 0.680
# This determines if Klipper should command the pin to move up
# between each probe attempt when performing a multiple probe
# sequence. Read the directions in docs/BLTouch.md before setting
# this to False. The default is True.
#stow_on_each_sample: True
# If this is set to True then Klipper will probe with the device in
# "touch_mode". The default is False (probing in "pin_down" mode).
#probe_with_touch_mode: False
# Set if the BLTouch consistently reports the probe in a "not
# triggered" state after a successful "pin_up" command. This should
# be True for all genuine BLTouch devices. Read the directions in
# docs/BLTouch.md before setting this to False. The default is True.
#pin_up_reports_not_triggered: True
# Set if the BLTouch consistently reports a "triggered" state after
# the commands "pin_up" followed by "touch_mode". This should be
# True for all genuine BLTouch devices. Read the directions in
# docs/BLTouch.md before setting this to False. The default is True.
#pin_up_touch_mode_reports_triggered: True
# Request a specific sensor pin output mode on the BLTouch V3.0 (and
# later). This setting should not be used on other types of probes.
# Set to "5V" to request a sensor pin output of 5 Volts (only use if
# the controller board needs 5V mode and is 5V tolerant on its input
# signal line). Set to "OD" to request the sensor pin output use
# open drain mode. The default is to not request an output mode.
#set_output_mode:
# See the "probe" section for information on these parameters.
x_offset: -44
y_offset: -4
z_offset: 0.7
#speed:
#lift_speed:
#samples:
#sample_retract_dist:
#samples_result:
#samples_tolerance:
#samples_tolerance_retries:

[safe_z_home]
home_xy_position: 117, 117 # The center of the print bed
speed: 50
z_hop: 10                  # Move up 10mm
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 185, 220   # roughly position_max + offset, minus a margin
probe_count: 5, 5
# Shift the mesh so it reads zero where Z was homed (safe_z_home's
# home_xy_position minus the probe offsets). Without this, a mesh probed
# against a stale Z home offsets the whole bed.
zero_reference_position: 73, 113

# https://www.klipper3d.org/Manual_Level.html#adjusting-bed-leveling-screws-using-the-bed-probe
# Run SCREWS_TILT_CALCULATE after homing.
#
# Coordinates are nozzle positions that put the probe over each screw
# (screw position minus the probe offset). Ender 3 screws are ~33mm in
# from each edge, so with x_offset -44 / y_offset -4:
#   left:  33 + 44 = 77      front: 33 + 4 = 37
#   right: 202 + 44 = 246 -> clamped to position_max (probe lands ~11mm
#          left of the screw, which is close enough)
#   back:  202 + 4 = 206
[screws_tilt_adjust]
screw1: 77, 37
screw1_name: front left screw
screw2: 235, 37
screw2_name: front right screw
screw3: 235, 206
screw3_name: rear right screw
screw4: 77, 206
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4
